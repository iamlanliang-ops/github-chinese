name: 仓库已冻结 - 自动回滚并关闭议题/拉取请求

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

env:
  FREEZE_COMMIT: 48bef76442d1f795f8c2e61739da8f66e4da31ca

jobs:
  close-issues:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 关闭议题
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **本仓库已冻结在 2026年5月17日 23:00（UTC+8）状态，不再接受任何修改。**\n\nThis repository is frozen at the May 17, 2026 23:00 (UTC+8) state. No modifications are accepted.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'not_planned'
            });

  close-pull-requests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: 关闭拉取请求
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '⚠️ **本仓库已冻结在 2026年5月17日 23:00（UTC+8）状态，不再接受任何修改。**\n\nThis repository is frozen at the May 17, 2026 23:00 (UTC+8) state. No modifications are accepted.'
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              state: 'closed'
            });

  restore-freeze-state:
    if: github.event_name == 'push' && github.sha != '48bef76442d1f795f8c2e61739da8f66e4da31ca'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 回滚 gh-pages 到冻结提交
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/gh-pages',
              sha: process.env.FREEZE_COMMIT,
              force: true
            });
